name: Publish vendor admin

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          APPLICATION_MODE: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_REST_API_ENDPOINT: https://shievon.in/dev/api
          NEXT_PUBLIC_SHOP_URL: https://shievon.in
          NEXT_PUBLIC_DEFAULT_LANGUAGE: en
          NEXT_PUBLIC_ENABLE_MULTI_LANG: 'false'
          NEXT_PUBLIC_AVAILABLE_LANGUAGES: en
          NEXT_PUBLIC_AUTH_TOKEN_KEY: AUTH_CRED
          NEXT_PUBLIC_VERSION: 11.10.2
          NEXT_PUBLIC_PUSHER_DEV_MOOD: 'false'
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
